name: Release Ziwa Studio

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: false
        default: v1.0.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Windows Installer & Publish Release
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Release Gates (Docs, Version, Installer Policy)
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          node scripts/docs-gate.mjs --strict-refs
          node scripts/release.mjs --check --tag $tag
          node scripts/installer-policy-check.mjs

      - name: Restore, Format Check & Full Test Acceptance
        run: |
          dotnet restore Ziwa.sln
          dotnet format Ziwa.sln --verify-no-changes --no-restore
          dotnet build Ziwa.sln -c Release --no-restore
          dotnet test Ziwa.sln -c Release --no-build --verbosity normal

      - name: Publish Ziwa.App (win-x64 self-contained)
        run: >
          dotnet publish src/Ziwa.App/Ziwa.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts/publish/win-x64

      - name: Prepare Portable Archive & Build InnoSetup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $ver = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version.Trim()
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath "artifacts/release/ZiwaStudio-win-x64-$ver.zip" -Force

          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          }
          iscc.exe installer/ZiwaStudio.iss

          if (-not (Test-Path "artifacts/release/ZiwaStudio-Setup-$ver.exe")) {
            throw "InnoSetup installer was not generated."
          }

      - name: Generate ziwa-checksums.txt & Assemble CHANGELOG.md
        run: |
          node scripts/release.mjs --checksums artifacts/release
          node scripts/release.mjs --changelog

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            artifacts/release/ZiwaStudio-Setup-*.exe
            artifacts/release/ZiwaStudio-win-x64-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/ZiwaStudio-Setup-*.exe
            artifacts/release/ZiwaStudio-win-x64-*.zip
            artifacts/release/ziwa-checksums.txt
          fail_on_unmatched_files: true
          body_path: CHANGELOG.md
          name: Ziwa Studio ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
