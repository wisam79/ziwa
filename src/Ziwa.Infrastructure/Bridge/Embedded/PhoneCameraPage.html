<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ziwa Studio Camera</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ziwa Cam">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090b10">
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg: #090b10;
      --panel: #11141b;
      --border: rgba(255, 255, 255, 0.09);
      --border-hover: rgba(255, 255, 255, 0.18);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 20px calc(env(safe-area-inset-bottom, 16px) + 12px);
      user-select: none;
    }

    header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn.active {
      color: var(--text);
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.05);
    }

    main {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin: auto 0;
    }

    .capture-panel {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .shutter-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px solid var(--border);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .shutter-button {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .shutter-button:active {
      transform: scale(0.95);
      background: var(--primary-hover);
    }

    .shutter-camera {
      width: 44px;
      height: 44px;
      fill: #fff;
    }

    .shutter-label {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }

    .progress-state,
    .success-state,
    .error-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 18px 0;
    }

    .progress-ring {
      width: 52px;
      height: 52px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-text {
      font-family: ui-monospace, monospace;
      font-size: 13px;
      color: var(--text-muted);
    }

    .success-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--success);
    }

    .error-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--danger);
    }

    .reel-panel {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
    }

    .thumb {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      border: 1px solid var(--border);
      object-fit: cover;
      flex-shrink: 0;
    }

    footer {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .latency-val {
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">Z</div>
      <span class="brand-title">Ziwa Studio</span>
    </div>
    <div class="header-right">
      <button id="sound-btn" class="icon-btn active" type="button" title="الصوت">🔊</button>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span id="conn-text">متصل</span>
      </div>
    </div>
  </header>

  <main>
    <div class="capture-panel">
      <div id="state-idle">
        <div class="shutter-ring">
          <label for="camera-in" class="shutter-button" aria-label="التقاط صورة بالكاميرا الخلفية">
            <svg class="shutter-camera" viewBox="0 0 24 24">
              <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
            </svg>
          </label>
        </div>
        <div class="shutter-label">التقاط بالكاميرا الخلفية</div>
        <label for="gallery-in" class="action-btn">
          <svg viewBox="0 0 24 24">
            <path d="M19 19H5V5h14m0-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m-7 8l-3.5 4.5H18L13.5 10l-2.5 3Z"/>
          </svg>
          <span>اختيار من المعرض</span>
        </label>
      </div>

      <div id="state-uploading" class="progress-state">
        <div class="progress-ring"></div>
        <div class="progress-text" id="pct-text">جاري الرفع ...</div>
      </div>

      <div id="state-success" class="success-state">
        <div class="success-text">تمت الإضافة إلى Ziwa Studio ✓</div>
      </div>

      <div id="state-error" class="error-state">
        <div class="error-text" id="err-text">تعذر إرسال الصورة</div>
      </div>

      <input type="file" id="camera-in" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="gallery-in" accept="image/*" multiple style="display:none;">
    </div>

    <div class="reel-panel" id="reel"></div>
  </main>

  <footer>
    <span>اتصال محلي آمن</span>
    <span class="latency-val" id="ping">-- ms</span>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';
    let sound = true;

    const idleView = document.getElementById('state-idle');
    const uploadView = document.getElementById('state-uploading');
    const successView = document.getElementById('state-success');
    const errorView = document.getElementById('state-error');
    const pctText = document.getElementById('pct-text');
    const errText = document.getElementById('err-text');
    const reel = document.getElementById('reel');

    document.getElementById('sound-btn').addEventListener('click', function () {
      sound = !sound;
      this.classList.toggle('active', sound);
    });

    function setView(v) {
      idleView.style.display = v === 'idle' ? 'block' : 'none';
      uploadView.style.display = v === 'upload' ? 'flex' : 'none';
      successView.style.display = v === 'success' ? 'flex' : 'none';
      errorView.style.display = v === 'error' ? 'flex' : 'none';
    }

    async function checkPing() {
      const t0 = performance.now();
      try {
        const res = await fetch('/ping', { cache: 'no-store' });
        if (res.ok) {
          document.getElementById('ping').textContent = Math.round(performance.now() - t0) + ' ms';
          document.getElementById('conn-text').textContent = 'متصل';
        }
      } catch {
        document.getElementById('ping').textContent = '--';
        document.getElementById('conn-text').textContent = 'منقطع';
      }
    }
    checkPing();
    setInterval(checkPing, 5000);

    async function optimizeImageFile(file, maxDim = 2048, quality = 0.88) {
      try {
        if (typeof createImageBitmap !== 'function') return file;
        const bitmap = await createImageBitmap(file);
        let w = bitmap.width;
        let h = bitmap.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else { w = Math.round((w * maxDim) / h); h = maxDim; }
        }
        if (w === bitmap.width && h === bitmap.height && file.size < 1200 * 1024 && file.type === 'image/jpeg') {
          bitmap.close();
          return file;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        if (!ctx) { bitmap.close(); return file; }
        ctx.drawImage(bitmap, 0, 0, w, h);
        bitmap.close();
        return await new Promise((resolve) => canvas.toBlob((blob) => resolve(blob || file), 'image/jpeg', quality));
      } catch {
        return file;
      }
    }

    async function sendFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      if (sound && navigator.vibrate) navigator.vibrate(50);

      setView('upload');
      pctText.textContent = 'جاري الرفع ...';

      const payloadBlob = await optimizeImageFile(file);
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = URL.createObjectURL(payloadBlob);
      reel.prepend(img);

      const form = new FormData();
      const baseName = (file.name || 'shot.jpg').replace(/\.[^.]+$/, '') + '.jpg';
      form.append('photo', payloadBlob, baseName);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload');
      xhr.setRequestHeader('X-Bridge-Token', token);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          pctText.textContent = Math.round((e.loaded / e.total) * 100) + '%';
        }
      };

      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          setView('success');
          if (sound && navigator.vibrate) navigator.vibrate(50);
          setTimeout(() => {
            setView('idle');
            document.getElementById('camera-in').value = '';
            document.getElementById('gallery-in').value = '';
          }, 900);
        } else {
          errText.textContent = 'فشل الإرسال (' + xhr.status + ')';
          setView('error');
          setTimeout(() => setView('idle'), 2000);
        }
      };

      xhr.onerror = () => {
        errText.textContent = 'تعذر الاتصال بالخادم المحلي';
        setView('error');
        setTimeout(() => setView('idle'), 2000);
      };

      xhr.send(form);
    }

    document.getElementById('camera-in').addEventListener('change', function () {
      if (this.files && this.files[0]) sendFile(this.files[0]);
    });

    document.getElementById('gallery-in').addEventListener('change', function () {
      if (this.files && this.files.length > 0) {
        for (let i = 0; i < this.files.length; i++) sendFile(this.files[i]);
      }
    });
  </script>
</body>
</html>
